name: LLM Agent CI

on:
  push:
    branches: [ main, feature-test ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile python/orchestrator.py
          python -m py_compile python/db_writer.py
          python -m py_compile python/subagent_runner.py

      - name: Success
        run: echo CI finished successfully